<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Applies the last theme this device saw before anything else loads, so first paint never
      shows the wrong one (ADR 0006). Reads the same `kaizen.theme` cache `theme.ts` writes;
      resolves `system` (and anything missing or invalid) through the OS setting. No-ops when
      storage is blocked (private mode, disabled cookies) — the page just starts light, as before
      this cache existed.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kaizen.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // Storage or matchMedia unavailable: no-op, same as a first-ever visit.
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#86281d" />
    <title>Kaizen Tasks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
